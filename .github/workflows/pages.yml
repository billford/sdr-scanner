name: Deploy Pages

on:
  # gh-pages commits are pushed directly by dashboard.py (git plumbing, no
  # workflow files in that tree), so a push trigger on gh-pages won't fire.
  # dashboard.py dispatches this workflow directly via the API after each
  # push, so the schedule below is just a fallback in case that dispatch
  # doesn't happen (script crash, gh auth issue, etc) — GitHub silently
  # throttles high-frequency schedules to well beyond their stated interval,
  # so don't rely on this for anything time-sensitive.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 min, which a slow Pages rollout can exceed and report
          # as a failed build even though the deploy goes on to succeed.
          timeout: 1200000
